<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla WebRTC Car Peer</title><style>body{margin:0;background:#0d0e11;color:#f5f5f5;font-family:Arial,sans-serif;padding:28px}h1{font-size:34px}.card{background:#181a20;border-radius:14px;padding:20px;margin:16px 0;font-size:20px;line-height:1.5}.ok{color:#4cff9a}.bad{color:#ff7777}.warn{color:#ffd76a}pre{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.45}button{font-size:18px;padding:12px 18px;border:0;border-radius:10px;margin-right:8px}</style><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script></head><body><h1>TESLA ↔ PHONE WEBRTC</h1><div class="card"><div id="server">PeerJS：连接中</div><div id="peer">Phone：等待</div><div id="route">链路：等待</div><div id="traffic">DataChannel：等待</div><div id="rtt">RTT：等待</div></div><div class="card"><button onclick="connectNow()">连接手机</button><button onclick="location.reload()">重新测试</button></div><div class="card"><pre id="log"></pre></div><script>var PHONE='hanz-tesla-lyrics-phone-20260828';var peer=null,conn=null,pingTimer=null;function el(id){return document.getElementById(id)}function log(s){el('log').textContent+=s+'\n'}if(typeof Peer==='undefined'){el('server').innerHTML='PeerJS：<span class=bad>脚本加载失败</span>'}else{peer=new Peer({config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',function(id){el('server').innerHTML='PeerJS：<span class=ok>在线</span> '+id;log('Peer open '+id);setTimeout(connectNow,500)});peer.on('error',function(e){el('server').innerHTML='PeerJS：<span class=bad>'+String(e.type||e)+'</span>';log('Peer error '+String(e.type||e))})}function connectNow(){if(!peer||peer.destroyed)return;if(conn&&conn.open)return;el('peer').textContent='Phone：正在建立真实跨设备连接…';try{conn=peer.connect(PHONE,{serialization:'json',reliable:true});bind(conn)}catch(e){el('peer').innerHTML='Phone：<span class=bad>创建连接失败</span>';log(String(e))}}function bind(c){c.on('open',function(){el('peer').innerHTML='Phone：<span class=ok>已连接</span>';el('traffic').innerHTML='DataChannel：<span class=ok>已打开</span>';log('DataChannel open');if(pingTimer)clearInterval(pingTimer);ping();pingTimer=setInterval(ping,1500);stats(c)});c.on('data',function(d){log('RX '+JSON.stringify(d));if(d&&d.kind==='phone_tick')el('traffic').innerHTML='DataChannel：<span class=ok>持续收到手机数据</span>';if(d&&d.kind==='pong'){var ms=Date.now()-d.t;el('rtt').innerHTML='RTT：<span class=ok>'+ms+' ms</span>'}});c.on('close',function(){el('peer').innerHTML='Phone：<span class=bad>已断开</span>';if(pingTimer)clearInterval(pingTimer)});c.on('error',function(e){log('Connection error '+String(e))})}function ping(){if(conn&&conn.open){var t=Date.now();conn.send({kind:'ping',t:t,text:'TESLA_PING'})}}function stats(c){var pc=c.peerConnection||c._pc||c.pc;if(!pc||!pc.getStats){el('route').textContent='链路：getStats 不可用';return;}setTimeout(function(){try{var p=pc.getStats();if(!p||!p.then)return;p.then(function(r){var all={};r.forEach(function(x){all[x.id]=x});var pair=null;r.forEach(function(x){if(x.type==='candidate-pair'&&x.state==='succeeded'&&(x.nominated||x.selected))pair=x});if(!pair){el('route').textContent='链路：已连接，但未解析 candidate pair';return;}var l=all[pair.localCandidateId]||{},rr=all[pair.remoteCandidateId]||{};var lt=l.candidateType||'?';var rt=rr.candidateType||'?';var direct=(lt!=='relay'&&rt!=='relay');el('route').innerHTML='链路：'+(direct?'<span class=ok>DIRECT / 无 TURN</span>':'<span class=bad>RELAY / TURN</span>')+' · '+lt+' ↔ '+rt;log('Selected '+lt+' <-> '+rt)}).catch(function(e){log('Stats '+e)})}catch(e){log('Stats '+e)}},1800)}</script></body></html>
