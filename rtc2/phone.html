<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla WebRTC Phone Peer</title><style>body{margin:0;background:#0d0e11;color:#f5f5f5;font-family:Arial,sans-serif;padding:24px}h1{font-size:28px}.card{background:#181a20;border-radius:14px;padding:18px;margin:14px 0}.ok{color:#4cff9a}.bad{color:#ff7777}.warn{color:#ffd76a}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.45}button{font-size:17px;padding:12px 18px;border:0;border-radius:10px;margin-right:8px}</style><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script></head><body><h1>PHONE WEBRTC PEER</h1><div class="card"><div id="server">PeerJS：连接中</div><div id="peer">Tesla：等待连接</div><div id="route">链路：等待</div><div id="traffic">DataChannel：等待</div></div><div class="card"><button onclick="location.reload()">重新启动</button></div><div class="card"><pre id="log"></pre></div><script>(function(){var PHONE='hanz-tesla-lyrics-phone-20260828';var el=function(id){return document.getElementById(id)};var log=function(s){el('log').textContent+=s+'\n'};if(typeof Peer==='undefined'){el('server').innerHTML='PeerJS：<span class=bad>脚本加载失败</span>';return;}var peer=new Peer(PHONE,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});var timer=null;peer.on('open',function(id){el('server').innerHTML='PeerJS：<span class=ok>在线</span> '+id;log('Peer open '+id)});peer.on('error',function(e){el('server').innerHTML='PeerJS：<span class=bad>'+String(e.type||e)+'</span>';log('Peer error '+String(e.type||e))});peer.on('connection',function(c){el('peer').innerHTML='Tesla：连接请求 '+c.peer;log('Incoming '+c.peer);bind(c)});function bind(c){c.on('open',function(){el('peer').innerHTML='Tesla：<span class=ok>DataChannel 已连接</span>';el('traffic').innerHTML='DataChannel：<span class=ok>双向测试中</span>';log('DataChannel open');if(timer)clearInterval(timer);timer=setInterval(function(){if(c.open)c.send({kind:'phone_tick',t:Date.now(),text:'PHONE_HELLO'})},1000);stats(c)});c.on('data',function(d){el('traffic').innerHTML='DataChannel：<span class=ok>收到 Tesla 数据</span>';log('RX '+JSON.stringify(d));if(d&&d.kind==='ping')c.send({kind:'pong',t:d.t,phone:Date.now()})});c.on('close',function(){el('peer').innerHTML='Tesla：<span class=bad>已断开</span>';if(timer)clearInterval(timer)});c.on('error',function(e){log('Connection error '+String(e))})}function stats(c){var pc=c.peerConnection||c._pc||c.pc;if(!pc||!pc.getStats){el('route').textContent='链路：getStats 不可用';return;}setTimeout(function(){try{var p=pc.getStats();if(!p||!p.then)return;p.then(function(r){var all={};r.forEach(function(x){all[x.id]=x});var pair=null;r.forEach(function(x){if(x.type==='candidate-pair'&&x.state==='succeeded'&&(x.nominated||x.selected))pair=x});if(!pair){el('route').textContent='链路：已连接，但未解析 candidate pair';return;}var l=all[pair.localCandidateId]||{},rr=all[pair.remoteCandidateId]||{};var lt=l.candidateType||'?';var rt=rr.candidateType||'?';var direct=(lt!=='relay'&&rt!=='relay');el('route').innerHTML='链路：'+(direct?'<span class=ok>DIRECT / 无 TURN</span>':'<span class=bad>RELAY</span>')+' · '+lt+' ↔ '+rt;log('Selected '+lt+' <-> '+rt)}).catch(function(e){log('Stats '+e)})}catch(e){log('Stats '+e)}},1800)}})();</script></body></html>
