function compact(s){return String(s||'').toLowerCase().replace(/[\s\-—_·•.,，。!！?？:：'"“”‘’/\\]/g,'')}

function scoreItem(x,s,ct,pa){if(!x||!x.syncedLyrics)return -99999;var sc=0,tn=compact(x.trackName||x.name),want=compact(ct),orig=compact(s.title),ar=compact(x.artistName),pp=compact(pa);if(tn===want)sc+=130;else if(tn===orig)sc+=120;else if(tn.indexOf(want)>=0||want.indexOf(tn)>=0)sc+=70;if(pp&&ar.indexOf(pp)>=0)sc+=80;var d=Number(x.duration)||0,w=Number(s.duration||0)/1000;if(d&&w){var diff=Math.abs(d-w);if(diff<=2.5)sc+=90;else if(diff<=5)sc+=60;else if(diff<=10)sc+=25;else if(diff>25)sc-=80}return sc}
