function sendCommand(action,extra){var x={kind:'control',action:action,ts:Date.now()};if(extra)for(var k in extra)x[k]=extra[k];fetch('https://ntfy.sh/'+CMD_TOPIC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8','Cache':'no'},body:JSON.stringify(x)}).catch(function(){})}
document.getElementById('prevBtn').onclick=function(){sendCommand('previous')};document.getElementById('nextBtn').onclick=function(){sendCommand('next')};toggleBtn.onclick=function(){sendCommand('toggle')};document.getElementById('delayEarlier').onclick=function(){adjustDelay(-500)};document.getElementById('delayLater').onclick=function(){adjustDelay(500)};document.getElementById('dockClose').onclick=function(){document.body.classList.add('dockHidden');try{localStorage.setItem(DOCK_KEY,'1')}catch(e){}};document.getElementById('dockOpen').onclick=function(){document.body.classList.remove('dockHidden');try{localStorage.setItem(DOCK_KEY,'0')}catch(e){}};
function seekFromClientX(x,commit){if(!state||!Number(state.duration))return;var r=progressEl.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(x-r.left)/r.width));dragMs=Math.round(Number(state.duration)*ratio);renderClock();if(commit){var target=dragMs;dragMs=null;state.elapsed=target;lastEnvelopeTime=Date.now()/1000;sendCommand('seek',{position:target});renderClock();scheduleLyrics(true)}}
var dragging=false;progressEl.addEventListener('mousedown',function(e){dragging=true;seekFromClientX(e.clientX,false)});window.addEventListener('mousemove',function(e){if(dragging)seekFromClientX(e.clientX,false)});window.addEventListener('mouseup',function(e){if(dragging){dragging=false;seekFromClientX(e.clientX,true)}});progressEl.addEventListener('touchstart',function(e){dragging=true;seekFromClientX(e.touches[0].clientX,false);e.preventDefault()},{passive:false});progressEl.addEventListener('touchmove',function(e){if(dragging)seekFromClientX(e.touches[0].clientX,false);e.preventDefault()},{passive:false});progressEl.addEventListener('touchend',function(e){if(dragging){dragging=false;var x=e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientX:progressEl.getBoundingClientRect().left;seekFromClientX(x,true)}e.preventDefault()},{passive:false});
function acceptEnvelope(env){if(!env||env.event!=='message')return;if(env.attachment&&env.attachment.url){acceptLyricsAttachment(env);return}var s;try{s=JSON.parse(env.message)}catch(e){return}if(s.kind&&s.kind!=='state')return;var et=Number(env.time)||Math.floor(Date.now()/1000);if(lastEnvelopeTime&&et+1<lastEnvelopeTime)return;lastEnvelopeTime=et;state=s;titleEl.textContent=simp(s.title||'未知歌曲');artistEl.textContent=simp((s.artist||'')+(s.source?' · '+s.source:''));var key=[s.title,s.artist,s.album,s.duration].join('|');if(key!==lastTrack){lastTrack=key;authoritativeKey='';setCover(s);loadLyrics(s,key)}else{renderClock();scheduleLyrics(true)}}
refreshDelayUi();renderClock();
var es=null;async function startStateStream(){var since='latest';try{var r=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1&since=12h&tags=notes',{cache:'no-store'});if(r.ok){var txt=await r.text(),rows=txt.trim()?txt.trim().split(/\n+/):[],latest=null;for(var i=0;i<rows.length;i++){try{var env=JSON.parse(rows[i]);if(env&&env.event==='message'){var s=JSON.parse(env.message||'{}');if(!s.kind||s.kind==='state')latest=env}}catch(e){}}if(latest){acceptEnvelope(latest);since=latest.id||String(latest.time||'latest')}}}catch(e){}es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse?since='+encodeURIComponent(since));es.onopen=function(){if(!state)statusEl.textContent='已连接 · 等待播放器'};es.onmessage=function(e){try{acceptEnvelope(JSON.parse(e.data))}catch(_){}};es.onerror=function(){statusEl.textContent='连接中…'}}
startStateStream();setInterval(renderClock,500);
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(lyricTimer)}else{renderClock();scheduleLyrics(true)}});
})();
