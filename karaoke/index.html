<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tesla Karaoke Probe</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif;padding:34px}h1{font-size:34px}.card{background:#171a21;border-radius:18px;padding:22px;margin:18px 0}.ok{color:#58f29b}.bad{color:#ff8585}button{width:100%;font-size:26px;font-weight:700;padding:22px;border:0;border-radius:16px;background:#fff;color:#111;margin-top:16px}.muted{color:#aab1bd;line-height:1.6}</style><script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script></head><body><h1>随心唱控制测试</h1><div class="card"><div id="status">WSS：连接中…</div><div class="muted" style="margin-top:10px">这页只发送控制命令，不播放任何浏览器音频。</div></div><div class="card"><button id="karaoke">打开随心唱</button><button id="resync">重新同步</button></div><script>(function(){'use strict';var BROKER='wss://broker.emqx.io:8084/mqtt',CMD='teslalyrics/hanz316/9f2c7e6a3b8d4f10a15c/cmd',c=null,s=document.getElementById('status');function send(a){if(!c||!c.connected){s.innerHTML='WSS：<span class=bad>未连接</span>';return}c.publish(CMD,JSON.stringify({kind:'control',action:a,ts:Date.now()}),{qos:0,retain:false});s.innerHTML='WSS：<span class=ok>命令已发送：'+a+'</span>'}document.getElementById('karaoke').onclick=function(){send('karaoke')};document.getElementById('resync').onclick=function(){send('resync')};if(!window.mqtt){s.innerHTML='WSS：<span class=bad>MQTT 库加载失败</span>';return}c=mqtt.connect(BROKER,{clientId:'tlx-karaoke-'+Math.random().toString(16).slice(2),clean:true,keepalive:30,reconnectPeriod:1500,connectTimeout:10000,protocolVersion:4});c.on('connect',function(){s.innerHTML='WSS：<span class=ok>已连接</span>'});c.on('reconnect',function(){s.textContent='WSS：重新连接中…'});c.on('error',function(e){s.innerHTML='WSS：<span class=bad>'+String(e&&e.message||e)+'</span>'})})();</script></body></html>
