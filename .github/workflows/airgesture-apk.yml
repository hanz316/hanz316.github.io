name: AirGesture Fast Scroll v0.3 build
on:
  push:
    branches: [airgesture-fast-scroll-v03]
    paths:
      - 'airgesture/fast-scroll-patch/**'
      - '.github/workflows/airgesture-apk.yml'
  workflow_dispatch:
  pull_request:
    branches: [airgesture-fast-scroll-v03]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p airgesture/source
          cat airgesture/payload/{01,02,03,04,05,06,07,08}.txt | base64 -d > /tmp/airgesture-source.tar.xz
          echo 'a99541c9cbd2cc27d60f73260b203897a3e95f0ce54c6c7fba79ce1b335af7cb  /tmp/airgesture-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/airgesture-source.tar.xz -C airgesture/source
      - name: Fix Gradle Kotlin DSL imports in original source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("airgesture/source/app/build.gradle.kts")
          s = p.read_text()
          s = "import java.net.URI\nimport java.io.File\n" + s.replace("java.net.URI(", "URI(").replace("java.io.File(", "File(")
          s = s.replace("compileSdk = 35", "compileSdk = 36")
          p.write_text(s)
          root = Path("airgesture/source/build.gradle.kts")
          root.write_text(root.read_text().replace("8.9.2", "8.10.1"))
          PY
      - name: Apply verified Hand Landmarker fast-scroll patch
        shell: bash
        run: |
          set -euo pipefail
          cat airgesture/fast-scroll-patch/{01,02,03}.txt | base64 -d > /tmp/fast-scroll-v03.tar.xz
          echo '0afa01f59f77b8582ae70e1cb1579e02bcb4a79608c30f3ee255641cfb715451  /tmp/fast-scroll-v03.tar.xz' | sha256sum -c -
          tar -xJf /tmp/fast-scroll-v03.tar.xz -C airgesture/source
          python3 - <<'PY'
          from pathlib import Path
          root = Path("airgesture/source")
          p = root / "app/build.gradle.kts"
          s = p.read_text()
          s = s.replace("gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", "hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task")
          s = s.replace("gesture_recognizer.task", "hand_landmarker.task")
          s = s.replace("versionCode = 2", "versionCode = 3").replace('versionName = "0.2.0"', 'versionName = "0.3.0"')
          p.write_text(s)
          p = root / "app/src/main/java/dev/airgesture/GlobalControlService.kt"
          p.write_text(p.read_text().replace("duration: Long = 330L", "duration: Long = 160L").replace("val displacement = h * 0.42f", "val displacement = h * 0.58f"))
          p = root / "app/src/main/java/dev/airgesture/MainActivity.kt"
          s = p.read_text()
          s = s.replace("无接触，自由操控。", "空中手势 · 阅读模式")
          s = s.replace("用前置摄像头捕捉手势，在其他应用内完成滑动、点击与返回。", "针对 ChatGPT 长回答优化上下滚动；仅在停车或乘客使用时启用。")
          s = s.replace('"张开手掌，向左 / 右移动" to "左右滑动、切换页面",\n            "食指竖起" to "移动虚拟光标",\n            "拇指与食指捏合" to "在光标处点击 / 确认",\n            "双指 V 保持约 0.7 秒" to "返回上一页"', '"手掌停顿约 0.2 秒" to "重新允许下一次滚动",\n            "放下手掌再展开" to "重置滚动识别"')
          s = s.replace("if (i < 5) addSpace(commands, 15)", "if (i < 3) addSpace(commands, 15)")
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK with offline Hand Landmarker
        working-directory: airgesture/source
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Inspect APK and bundled model
        shell: bash
        run: |
          set -euo pipefail
          test -s airgesture/source/app/build/outputs/apk/debug/app-debug.apk
          test -s airgesture/source/app/src/main/assets/hand_landmarker.task
          sha256sum airgesture/source/app/build/outputs/apk/debug/app-debug.apk
          du -h airgesture/source/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AirGesture-v0.3.0-FastScroll-APK
          path: airgesture/source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download to build branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cp airgesture/source/app/build/outputs/apk/debug/app-debug.apk airgesture/AirGesture-v0.3.0-fast-scroll-debug.apk
          sha256sum airgesture/AirGesture-v0.3.0-fast-scroll-debug.apk > airgesture/AirGesture-v0.3.0-fast-scroll-debug.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airgesture/AirGesture-v0.3.0-fast-scroll-debug.apk airgesture/AirGesture-v0.3.0-fast-scroll-debug.apk.sha256
          git commit -m 'Publish compiled AirGesture APK'
          git push origin HEAD:airgesture-fast-scroll-v03
