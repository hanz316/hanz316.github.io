name: AirGesture APK cloud build
on:
  push:
    branches: [airgesture-apk-build]
    paths:
      - 'airgesture/payload/**'
      - '.github/workflows/airgesture-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p airgesture/source
          cat airgesture/payload/{01,02,03,04,05,06,07,08}.txt | base64 -d > /tmp/airgesture-source.tar.xz
          echo 'a99541c9cbd2cc27d60f73260b203897a3e95f0ce54c6c7fba79ce1b335af7cb  /tmp/airgesture-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/airgesture-source.tar.xz -C airgesture/source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK with offline recognition model
        working-directory: airgesture/source
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Inspect APK and bundled model
        shell: bash
        run: |
          set -euo pipefail
          test -s airgesture/source/app/build/outputs/apk/debug/app-debug.apk
          test -s airgesture/source/app/src/main/assets/gesture_recognizer.task
          sha256sum airgesture/source/app/build/outputs/apk/debug/app-debug.apk
          du -h airgesture/source/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AirGesture-v0.2.0-APK
          path: airgesture/source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download to build branch
        shell: bash
        run: |
          set -euo pipefail
          cp airgesture/source/app/build/outputs/apk/debug/app-debug.apk airgesture/AirGesture-v0.2.0-debug.apk
          sha256sum airgesture/AirGesture-v0.2.0-debug.apk > airgesture/AirGesture-v0.2.0-debug.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airgesture/AirGesture-v0.2.0-debug.apk airgesture/AirGesture-v0.2.0-debug.apk.sha256
          git commit -m 'Publish compiled AirGesture APK'
          git push origin HEAD:airgesture-apk-build
