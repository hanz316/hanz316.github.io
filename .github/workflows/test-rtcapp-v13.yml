name: Test TeslaLyrics v20 UI
on:
  push:
    paths:
      - 'rtcapp/car.html'
      - 'rtcapp/premium-v13.js'
      - 'rtcapp/premium-v13.css'
      - 'rtcapp/premium-v16-tune.css'
      - 'rtcapp/premium-v18.css'
      - 'rtcapp/premium-v18-fit.js'
      - 'rtcapp/premium-v18-health.js'
      - 'rtcapp/premium-v19-noextras.js'
      - 'rtcapp/premium-v20-scroll.js'
      - 'rtcapp/premium-v20-scroll.css'
      - 'rtcapp/https-relay.js'
      - 'rtcapp/phone.html'
      - '.github/workflows/test-rtcapp-v13.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check rtcapp/premium-v13.js && node --check rtcapp/premium-v18-fit.js && node --check rtcapp/premium-v18-health.js && node --check rtcapp/premium-v19-noextras.js && node --check rtcapp/premium-v20-scroll.js && node --check rtcapp/https-relay.js
      - name: Inline relay syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['car.html','phone.html']:
              text=Path('rtcapp/'+name).read_text()
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
              inline=[b for b in blocks if b.strip()]
              if not inline: raise SystemExit('no inline script in '+name)
              Path('/tmp/'+name+'.js').write_text(inline[-1])
          PY
          node --check /tmp/car.html.js
          node --check /tmp/phone.html.js
      - name: Static Atom, transport and smooth-scroll checks
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('rtcapp/premium-v13.js').read_text()
          fit=Path('rtcapp/premium-v18-fit.js').read_text()
          health=Path('rtcapp/premium-v18-health.js').read_text()
          noextras=Path('rtcapp/premium-v19-noextras.js').read_text()
          scroll=Path('rtcapp/premium-v20-scroll.js').read_text()
          scrollcss=Path('rtcapp/premium-v20-scroll.css').read_text()
          relay=Path('rtcapp/https-relay.js').read_text()
          phone=Path('rtcapp/phone.html').read_text()
          css=Path('rtcapp/premium-v13.css').read_text()
          tune=Path('rtcapp/premium-v16-tune.css').read_text()
          v18=Path('rtcapp/premium-v18.css').read_text()
          loader=Path('rtcapp/car.html').read_text()
          assert 'Tesla Lyrics v20' in loader
          assert 'premium-v13.js?v=20' in loader
          assert 'premium-v18.css?v=20' in loader
          assert 'premium-v18-fit.js?v=20' in loader
          assert 'premium-v18-health.js?v=20' in loader
          assert 'premium-v19-noextras.js?v=20' in loader
          assert 'premium-v20-scroll.js?v=20' in loader
          assert 'premium-v20-scroll.css?v=20' in loader
          assert 'premium-v15-controls.js' not in loader
          assert 'https-relay.js?v=20' in loader
          assert 'window.tlxAcceptState)window.tlxAcceptState(x)' in loader
          assert 'window.tlxAcceptLyrics)window.tlxAcceptLyrics(x)' in loader
          assert 'tlxClearRemoteState' in loader
          assert 'for(var i=0;i<36;i++)' in js
          assert 'WebGL' not in js and 'AudioContext' not in js
          assert 'backdrop-filter' not in css and 'backdrop-filter' not in tune and 'backdrop-filter' not in v18 and 'backdrop-filter' not in scrollcss
          assert css.count('{') == css.count('}')
          assert tune.count('{') == tune.count('}')
          assert v18.count('{') == v18.count('}')
          assert scrollcss.count('{') == scrollcss.count('}')
          assert 'delete y.translation' in noextras and 'delete y.romaji' in noextras
          assert "cb.name==='frame'" in scroll
          assert 'MutationObserver' in scroll
          assert 'translate3d' in scroll
          assert 'transform 300ms' in scroll
          assert 'cloneNode(false)' in scroll
          assert 'will-change:transform,opacity' in scrollcss
          assert 'animation:none!important' in scrollcss
          assert 'MutationObserver' in fit and 'setInterval(function(){fit(false)},1800)' in fit
          assert 'v18Connected' in health and 'tlxRelayLastStateAt' in health
          assert 'Number(env.v)>17' in relay and "v:17,kind:'command'" in relay
          assert 'HTTP_HEARTBEAT_MS=18000' in phone and 'ANDROID_STATE_TTL_MS=45000' in phone
          print('v20 static checks passed')
          PY
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@22
      - name: DOM, lyric and smooth-scroll regression test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          (async()=>{
          const html=`<!doctype html><html><body>
          <div id="coverBg"></div><div id="aurora"></div><div id="shade"></div>
          <div id="app"><header><div class="track"><div id="title" class="title">等待</div><div id="artist" class="artist">Tesla Lyrics</div></div><div id="status">播放中 · HTTPS兼容线路</div></header>
          <div id="lyrics"><div id="lyricsGroup"><div class="line m2"><span class="txt">older</span></div><div class="line m1"><span class="txt">previous</span></div><div class="line active"><span class="txt">hello</span></div><div class="line p1"><span class="txt">next lyric</span></div><div class="line p2"><span class="txt">later</span></div><div class="line p3"><span class="txt">last</span></div></div></div>
          <div id="controlDock"><button id="dockClose"></button><div class="delayRow"></div><div id="delayValue">延迟 1.0s</div><div class="dockBottom"></div></div><button id="dockOpen"></button><div id="progressWrap"><div class="bar"><div id="fill" class="fill"></div></div></div><footer></footer></div>
          </body></html>`;
          const dom=new JSDOM(html,{runScripts:'outside-only',pretendToBeVisual:true,url:'https://example.com'});
          const w=dom.window;
          let raf=null, forwarded=null;
          w.requestAnimationFrame=(cb)=>{raf=cb;return 1};
          w.cancelAnimationFrame=()=>{};
          w.Image=function(){this.style={};};
          Object.defineProperty(w.Image.prototype,'src',{set(){}});
          w.XMLHttpRequest=function(){this.open=()=>{};this.send=()=>{};};
          w.tlxAcceptState=(x)=>{};
          w.tlxAcceptLyrics=(x)=>{forwarded=x};
          const lyrics=w.document.getElementById('lyrics'), group=w.document.getElementById('lyricsGroup');
          lyrics.getBoundingClientRect=()=>({left:0,top:0,width:900,height:430,right:900,bottom:430});
          group.getBoundingClientRect=()=>({left:40,top:30,width:780,height:340,right:820,bottom:370});
          Object.defineProperty(group,'offsetHeight',{get:()=>340});
          w.eval(fs.readFileSync('rtcapp/premium-v13.js','utf8'));
          w.eval(fs.readFileSync('rtcapp/premium-v20-scroll.js','utf8'));
          w.eval(fs.readFileSync('rtcapp/premium-v18-fit.js','utf8'));
          w.eval(fs.readFileSync('rtcapp/premium-v18-health.js','utf8'));
          w.eval(fs.readFileSync('rtcapp/premium-v19-noextras.js','utf8'));
          w.document.dispatchEvent(new w.Event('DOMContentLoaded'));
          if(!w.document.getElementById('premiumNowCard')) throw new Error('cover card missing');
          if(w.document.querySelectorAll('.premiumWaveBar').length!==36) throw new Error('waveform bar count');
          if(w.document.getElementById('premiumToggleTranslation')||w.document.getElementById('premiumToggleRomaji')) throw new Error('translation controls still present');
          w.tlxAcceptState({kind:'state',title:'Test Song',artist:'Singer',album:'Album',duration:180000,elapsed:20000,playing:true});
          w.tlxAcceptLyrics({kind:'lyrics',key:'x',lrc:'[00:10.000]Hello world\n[00:10.000]你好世界\n[00:20.000]Second line\n[00:20.000]第二句\n[00:30.000]Third line\n[00:40.000]Fourth line',translation:'x',romaji:'y'});
          if(!forwarded || (forwarded.lrc.match(/00:10/g)||[]).length!==1) throw new Error('duplicate timestamp extras not stripped');
          if(forwarded.translation||forwarded.romaji) throw new Error('extra lyric fields not stripped');
          // Simulate a normal next-line update: the old active line becomes m1 and next becomes active.
          w.document.querySelector('.line.m1 .txt').textContent='hello';
          w.document.querySelector('.line.active .txt').textContent='next lyric';
          await new Promise(r=>setTimeout(r,25));
          if(!w.document.querySelector('.v20Ghost')) throw new Error('smooth-scroll ghost not created');
          if(!group.classList.contains('v20Incoming')) throw new Error('incoming lyric layer not animated');
          if(!String(group.style.transform).includes('translate3d')) throw new Error('GPU transform not applied');
          console.log('v20 DOM + smooth-scroll regression passed');
          w.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
