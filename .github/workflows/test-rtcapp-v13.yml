name: Test TeslaLyrics v14 UI
on:
  push:
    paths:
      - 'rtcapp/car.html'
      - 'rtcapp/premium-v13.js'
      - 'rtcapp/premium-v13.css'
      - 'rtcapp/premium-v14-tune.css'
      - 'rtcapp/https-relay.js'
      - '.github/workflows/test-rtcapp-v13.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check rtcapp/premium-v13.js && node --check rtcapp/https-relay.js
      - name: Static Atom safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('rtcapp/premium-v13.js').read_text()
          css=Path('rtcapp/premium-v13.css').read_text()
          tune=Path('rtcapp/premium-v14-tune.css').read_text()
          loader=Path('rtcapp/car.html').read_text()
          assert 'premium-v13.js?v=14' in loader
          assert 'premium-v13.css?v=14' in loader
          assert 'premium-v14-tune.css?v=14' in loader
          assert 'https-relay.js?v=14' in loader
          assert 'for(var i=0;i<36;i++)' in js
          assert 'WebGL' not in js and 'AudioContext' not in js
          assert 'backdrop-filter' not in css and 'backdrop-filter' not in tune
          assert 'return112' not in js
          assert css.count('{') == css.count('}')
          assert tune.count('{') == tune.count('}')
          print('static checks passed')
          PY
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@22
      - name: DOM and lyric regression test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=`<!doctype html><html><body>
          <div id="coverBg"></div><div id="aurora"></div><div id="shade"></div>
          <div id="app"><header><div class="track"><div id="title" class="title">等待</div><div id="artist" class="artist">Tesla Lyrics</div></div><div id="status"></div></header>
          <div id="lyrics"><div id="lyricsGroup"><div class="line m2"><span class="txt"></span></div><div class="line m1"><span class="txt"></span></div><div class="line active"><span class="txt">hello</span></div><div class="line p1"><span class="txt"></span></div><div class="line p2"><span class="txt"></span></div><div class="line p3"><span class="txt"></span></div></div></div>
          <div id="controlDock"><button id="dockClose"></button><div id="delayValue">延迟 1.0s</div></div><button id="dockOpen"></button><div id="progressWrap"><div class="bar"></div></div><footer></footer></div>
          </body></html>`;
          const dom=new JSDOM(html,{runScripts:'outside-only',pretendToBeVisual:true,url:'https://example.com'});
          const w=dom.window;
          let raf=null, forwarded=null;
          w.requestAnimationFrame=(cb)=>{raf=cb;return 1};
          w.cancelAnimationFrame=()=>{};
          w.Image=function(){this.style={};};
          Object.defineProperty(w.Image.prototype,'src',{set(){}});
          w.XMLHttpRequest=function(){this.open=()=>{};this.send=()=>{};};
          w.tlxAcceptState=(x)=>{};
          w.tlxAcceptLyrics=(x)=>{forwarded=x};
          w.eval(fs.readFileSync('rtcapp/premium-v13.js','utf8'));
          w.document.dispatchEvent(new w.Event('DOMContentLoaded'));
          if(!w.document.getElementById('premiumNowCard')) throw new Error('cover card missing');
          if(w.document.querySelectorAll('.premiumWaveBar').length!==36) throw new Error('waveform bar count');
          if(!w.document.getElementById('premiumStatus')) throw new Error('status indicator missing');
          w.tlxAcceptState({kind:'state',title:'Test Song',artist:'Singer',album:'Album',duration:180000,elapsed:20000,playing:true});
          w.tlxAcceptLyrics({kind:'lyrics',key:'x',lrc:'[00:10.000]Hello world\n[00:10.000]你好世界\n[00:20.000]Second line\n[00:20.000]第二句\n[00:30.000]Third line\n[00:40.000]Fourth line'});
          if(!forwarded || (forwarded.lrc.match(/00:10/g)||[]).length!==1) throw new Error('duplicate timestamp not normalized');
          if(typeof raf==='function') raf(1100);
          const bar=w.document.getElementById('premiumPhraseProgress');
          if(!bar || !bar.style.transform) throw new Error('phrase progress missing');
          const sub=w.document.getElementById('premiumSubline');
          if(!sub) throw new Error('bilingual subline missing');
          console.log('DOM regression passed');
          NODE
