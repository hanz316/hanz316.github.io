name: Sync Tesla public key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-tesla-public-key.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tesla virtual-key public key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .well-known/appspecific
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            https://68-155-148-209.sslip.io:8443/setup/public-key.pem \
            -o .well-known/appspecific/com.tesla.3p.public-key.pem
          grep -q 'BEGIN PUBLIC KEY' .well-known/appspecific/com.tesla.3p.public-key.pem
          grep -q 'END PUBLIC KEY' .well-known/appspecific/com.tesla.3p.public-key.pem
      - name: Commit updated key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .well-known/appspecific/com.tesla.3p.public-key.pem
          if git diff --cached --quiet; then
            echo 'Public key already current.'
            exit 0
          fi
          git commit -m 'Sync Tesla virtual key public key'
          git push
