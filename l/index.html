<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Lyrics 初始化</title>
<style>
html,body{margin:0;height:100%;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 20% 15%,#24385c 0,transparent 35%),radial-gradient(circle at 85% 80%,#382957 0,transparent 35%),#080b12}
.card{width:min(520px,88vw);padding:34px;border-radius:24px;background:rgba(12,17,29,.94);border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
h1{font-size:30px;margin:0 0 12px}.sub{font-size:16px;color:rgba(255,255,255,.68);line-height:1.55}
button{width:100%;height:52px;margin-top:20px;border:0;border-radius:14px;background:linear-gradient(100deg,#6d8cff,#a36eff);color:#fff;font-size:17px;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>正在连接 Tesla Lyrics</h1>
<div class="sub" id="msg">正在恢复固定通信通道，不需要输入配对码。</div>
<button id="go">进入歌词页面</button>
</div>
<script>
(function(){
var TOKEN='hanztesla888';
function fix(){
  try{localStorage.setItem('teslalyrics_pair_v1',TOKEN)}catch(e){}
  location.replace('/lyrics/?fixed=1');
}
document.getElementById('go').onclick=fix;
setTimeout(fix,450);
})();
</script>
</body>
</html>
