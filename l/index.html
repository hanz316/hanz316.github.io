<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Lyrics 配对</title>
<style>
html,body{margin:0;height:100%;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 20% 15%,#24385c 0,transparent 35%),radial-gradient(circle at 85% 80%,#382957 0,transparent 35%),#080b12}
.card{width:min(520px,88vw);padding:34px;border-radius:24px;background:rgba(12,17,29,.94);border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
h1{font-size:30px;margin:0 0 10px}.sub{font-size:16px;color:rgba(255,255,255,.65);line-height:1.5;margin-bottom:22px}
input{width:100%;height:64px;box-sizing:border-box;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.07);color:#fff;text-align:center;font-size:32px;font-weight:750;letter-spacing:10px;outline:0}
button{width:100%;height:54px;margin-top:14px;border:0;border-radius:14px;background:linear-gradient(100deg,#6d8cff,#a36eff);color:#fff;font-size:18px;font-weight:700}
#error{height:22px;margin-top:10px;color:#ffb7bd;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>连接 Tesla Lyrics</h1>
<div class="sub">输入手机上显示的 6 位数字。<br>只需要配对这一次。</div>
<input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000">
<button id="go">连接手机</button>
<div id="error"></div>
</div>
<script>
(function(){
var input=document.getElementById('code'),err=document.getElementById('error');
function expand(code){var m='';for(var i=0;i<code.length;i++){var c=code.charAt(i);m+=c==='0'?'a':(c==='1'?'b':c)}return m+m}
function go(){var c=(input.value||'').replace(/\D/g,'');if(!/^\d{6}$/.test(c)){err.textContent='请输入 6 位数字';return}try{localStorage.setItem('teslalyrics_pair_v1',expand(c))}catch(e){}location.replace('/lyrics/?paired=1')}
input.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,6);err.textContent=''});
input.addEventListener('keyup',function(e){if(e.key==='Enter')go()});
document.getElementById('go').onclick=go;
setTimeout(function(){try{input.focus()}catch(e){}},120);
})();
</script>
</body>
</html>
