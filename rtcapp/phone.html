<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Lyrics Android WSS Bridge</title><script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js'"></script>
<script src="dual-mqtt.js?v=8"></script></head><body><script>(function(){'use strict';var BROKER='wss://mqtt.eclipseprojects.io:443/mqtt';var BASE='teslalyrics/hanz316/9f2c7e6a3b8d4f10a15c';var STATE=BASE+'/state',LYR=BASE+'/lyrics',CMD=BASE+'/cmd';var client=null,ready=false,lastState=null,lastLyrics=null;function log(s){try{TeslaLyricsAndroid.onLog(String(s))}catch(e){}}function status(s){try{TeslaLyricsAndroid.onStatus(String(s))}catch(e){}}function summary(){return client&&client.tlxSummary?client.tlxSummary():'WSS connected'}function pub(topic,obj,retain){if(!client||!client.connected)return false;try{client.publish(topic,JSON.stringify(obj),{qos:0,retain:!!retain});return true}catch(e){log('publish '+e);return false}}function flush(){if(lastState)pub(STATE,lastState,true);if(lastLyrics)pub(LYR,lastLyrics,true)}window.tlxFromAndroid=function(raw){try{var x=typeof raw==='string'?JSON.parse(raw):raw;if(!x)return;if(x.kind==='state'){lastState=x;if(client&&client.connected)pub(STATE,x,true)}else if(x.kind==='lyrics'){lastLyrics=x;if(client&&client.connected)pub(LYR,x,true)}}catch(e){log('android json '+e)}};try{TeslaLyricsAndroid.onReady()}catch(e){}if(!window.mqtt){status('MQTT script failed');return}try{client=mqtt.connect(BROKER,{clientId:'tlxphone'+Math.random().toString(36).slice(2,12),clean:true,keepalive:25,reconnectPeriod:1000,connectTimeout:5000,protocolVersion:4});client.on('connect',function(){ready=true;status(summary());log('MQTT connected: '+summary());client.subscribe(CMD,{qos:0});try{TeslaLyricsAndroid.onConnected()}catch(e){}flush()});client.on('tlxlink',function(x){status(x&&x.summary?x.summary:summary());if(x)log('MQTT '+x.label+': '+(x.connected?'connected':'reconnecting')+(x.error?' '+x.error:''))});client.on('reconnect',function(){status(summary())});client.on('offline',function(){ready=false;status('WSS offline');try{TeslaLyricsAndroid.onDisconnected()}catch(e){}});client.on('close',function(){ready=false});client.on('error',function(e){status(summary());log('MQTT error '+String(e&&e.message||e))});client.on('message',function(topic,payload){if(topic!==CMD)return;try{var x=JSON.parse(String(payload||''));TeslaLyricsAndroid.onCommand(JSON.stringify(x))}catch(e){log('cmd '+e)}})}catch(e){status('MQTT init failed');log(String(e))}})();</script></body></html>
