<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Lyrics Android Relay v17</title><script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js'"></script><script src="dual-mqtt.js?v=17"></script></head><body><script>(function(){'use strict';
var BROKER='wss://demo.tbmq.io:443/mqtt',BASE='teslalyrics/hanz316/9f2c7e6a3b8d4f10a15c',STATE=BASE+'/state',LYR=BASE+'/lyrics',CMD=BASE+'/cmd';
var HTTP_ROOT='https://ntfy.sh/',HTTP_BASE='teslalyrics-hanz316-9f2c7e6a3b8d4f10a15c',HSTATE=HTTP_BASE+'-state',HLYR=HTTP_BASE+'-lyrics',HCMD=HTTP_BASE+'-cmd';
var HTTP_HEARTBEAT_MS=18000,ANDROID_STATE_TTL_MS=45000;
var client=null,ready=false,lastState=null,lastLyrics=null,lastAndroidStateAt=0,httpLastState=null,httpLastAt=0,httpLastSig='',httpLastLyricsSig='',lastCmdSig='';
function log(s){try{TeslaLyricsAndroid.onLog(String(s))}catch(e){}}function status(s){try{TeslaLyricsAndroid.onStatus(String(s))}catch(e){}}function summary(){return client&&client.tlxSummary?client.tlxSummary():'WSS connected'}
function httpPost(topic,text){try{var r=new XMLHttpRequest();r.open('POST',HTTP_ROOT+topic,true);r.timeout=8500;r.setRequestHeader('Content-Type','text/plain;charset=UTF-8');r.onerror=function(){log('HTTPS relay post failed')};r.ontimeout=function(){log('HTTPS relay post timeout')};r.send(text);return true}catch(e){log('HTTPS relay '+e);return false}}
function copyState(x){var y={},k;for(k in x)if(Object.prototype.hasOwnProperty.call(x,k))y[k]=x[k];return y}
function currentState(){if(!lastState)return null;var x=copyState(lastState),now=Date.now(),stamp=Number(x.sentAtMs)||now;if(x.playing&&now>stamp&&now-stamp<60000)x.elapsed=Math.max(0,(Number(x.elapsed)||0)+(now-stamp));x.sentAtMs=now;return x}
function idleState(){return {kind:'state',idle:true,title:'',artist:'',album:'',source:'',duration:0,elapsed:0,playing:false,sentAtMs:Date.now()}}
function httpState(x,force){var now=Date.now(),sig=[x.idle?'idle':'track',x.title||'',x.artist||'',x.album||'',Number(x.duration)||0,x.playing?'1':'0'].join('|'),need=!!force||!httpLastState||sig!==httpLastSig||now-httpLastAt>HTTP_HEARTBEAT_MS;if(!need&&httpLastState){var predicted=(Number(httpLastState.elapsed)||0)+(httpLastState.playing?now-httpLastAt:0);if(Math.abs((Number(x.elapsed)||0)-predicted)>2200)need=true}if(!need)return;var out=copyState(x);out.sentAtMs=now;httpLastState=copyState(out);httpLastSig=sig;httpLastAt=now;httpPost(HSTATE,JSON.stringify({v:17,kind:'state',payload:out}))}
function b64utf8(s){try{return btoa(unescape(encodeURIComponent(s)))}catch(e){return ''}}
function httpLyrics(x){var raw=JSON.stringify(x),sig=String(x.key||'')+'|'+String(x.provider||'')+'|'+raw.length;if(sig===httpLastLyricsSig)return;httpLastLyricsSig=sig;var b=b64utf8(raw);if(!b){httpPost(HLYR,JSON.stringify({v:17,kind:'lyrics',payload:x}));return}var size=2600,total=Math.ceil(b.length/size),id=Date.now().toString(36)+Math.random().toString(36).slice(2,7),i;for(i=0;i<total;i++)(function(part){setTimeout(function(){httpPost(HLYR,JSON.stringify({v:17,kind:'lyricsChunk',id:id,part:part,total:total,data:b.slice(part*size,(part+1)*size)}))},part*140)})(i)}
function handleHttpCmdData(data){try{var o=JSON.parse(String(data||''));if(o.event!=='message'||!o.message)return;var env=JSON.parse(o.message);if(!env||Number(env.v)<10||Number(env.v)>17||env.kind!=='command'||!env.payload)return;var x=env.payload;if(Math.abs(Date.now()-(Number(x.ts)||0))>15000)return;var sig=String(x.ts)+'|'+String(x.action);if(sig===lastCmdSig)return;lastCmdSig=sig;TeslaLyricsAndroid.onCommand(JSON.stringify(x))}catch(e){}}
function startHttpCommands(){var since=Math.floor(Date.now()/1000);if(window.EventSource)try{var es=new EventSource(HTTP_ROOT+HCMD+'/sse?since='+since);es.onmessage=function(e){handleHttpCmdData(e.data)};es.onerror=function(){};return}catch(e){}setInterval(function(){try{var r=new XMLHttpRequest();r.open('GET',HTTP_ROOT+HCMD+'/json?poll=1&since=10s&_='+Date.now(),true);r.onreadystatechange=function(){if(r.readyState!==4||r.status<200||r.status>=300)return;var a=String(r.responseText||'').split(/\r?\n/),i;for(i=0;i<a.length;i++)if(a[i])handleHttpCmdData(a[i])};r.send()}catch(e){}},5000)}
function pub(topic,obj,retain){if(!client||!client.connected)return false;try{client.publish(topic,JSON.stringify(obj),{qos:0,retain:!!retain});return true}catch(e){log('publish '+e);return false}}
function flush(){if(lastState)pub(STATE,lastState,true);if(lastLyrics)pub(LYR,lastLyrics,true)}
function expireAndroidState(){if(!lastState||lastState.idle)return;var now=Date.now();if(lastAndroidStateAt&&now-lastAndroidStateAt<=ANDROID_STATE_TTL_MS)return;lastState=idleState();httpState(lastState,true);if(client&&client.connected)pub(STATE,lastState,true);log('Android media state expired; published idle')}
window.tlxFromAndroid=function(raw){try{var x=typeof raw==='string'?JSON.parse(raw):raw;if(!x)return;if(x.kind==='state'){lastAndroidStateAt=Date.now();lastState=x;httpState(x,false);if(client&&client.connected)pub(STATE,x,true)}else if(x.kind==='lyrics'){lastLyrics=x;httpLyrics(x);if(client&&client.connected)pub(LYR,x,true)}}catch(e){log('android json '+e)}};
setInterval(function(){expireAndroidState();var x=currentState();if(x&&(lastState.idle||Date.now()-lastAndroidStateAt<=ANDROID_STATE_TTL_MS))httpState(x,true)},HTTP_HEARTBEAT_MS);
try{TeslaLyricsAndroid.onReady()}catch(e){}status('HTTPS兼容线路 v17 已就绪');log('HTTPS/SSE fallback v17 ready');startHttpCommands();
if(!window.mqtt){log('MQTT script unavailable; HTTPS fallback active');return}
try{client=mqtt.connect(BROKER,{clientId:'tlxphone'+Math.random().toString(36).slice(2,12),clean:true,keepalive:25,reconnectPeriod:900,connectTimeout:4500,protocolVersion:4,username:'demo'});client.on('connect',function(){ready=true;status(summary()+' · HTTPS自愈备用');log('MQTT connected: '+summary());client.subscribe(CMD,{qos:0});try{TeslaLyricsAndroid.onConnected()}catch(e){}flush()});client.on('tlxlink',function(x){status((x&&x.summary?x.summary:summary())+' · HTTPS自愈备用')});client.on('reconnect',function(){status('MQTT重连中 · HTTPS兼容线路可用')});client.on('offline',function(){ready=false;status('HTTPS兼容线路可用');try{TeslaLyricsAndroid.onDisconnected()}catch(e){}});client.on('close',function(){ready=false});client.on('error',function(e){status('HTTPS兼容线路可用');log('MQTT error '+String(e&&e.message||e))});client.on('message',function(topic,payload){if(topic!==CMD)return;try{TeslaLyricsAndroid.onCommand(String(payload||''))}catch(e){}})}catch(e){status('HTTPS兼容线路可用');log('MQTT init failed '+e)}
})();</script></body></html>
