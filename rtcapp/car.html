<style>
*{box-sizing:border-box}:root{--h1:220;--h2:285;--h3:166;--scrim:.52}html,body{margin:0;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;-webkit-user-select:none;user-select:none}button{font:inherit}
#coverBg{position:fixed;inset:-4%;z-index:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;filter:blur(14px) saturate(1.24) brightness(.77);transform:scale(1.09);transition:opacity .45s ease;pointer-events:none}#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 12% 16%,hsla(var(--h1),78%,56%,.46),transparent 33%),radial-gradient(circle at 88% 23%,hsla(var(--h2),78%,58%,.38),transparent 37%),radial-gradient(circle at 62% 88%,hsla(var(--h3),72%,48%,.34),transparent 38%),linear-gradient(145deg,hsla(var(--h1),45%,15%,.96),#090c14 46%,hsla(var(--h2),40%,13%,.94) 75%,#06070b)}#shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,4,9,.31),rgba(3,5,10,var(--scrim)) 44%,rgba(1,2,5,.64)),radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.44) 100%)}#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
header{height:15%;min-height:96px;padding:22px 42px 8px;display:flex;align-items:center;justify-content:space-between;gap:24px}.track{min-width:0;max-width:72%}.title{font-size:34px;line-height:1.15;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 9px rgba(0,0,0,.95)}.artist{font-size:19px;color:rgba(255,255,255,.74);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 7px rgba(0,0,0,.9)}.status{font-size:14px;color:rgba(255,255,255,.62);text-align:right;white-space:nowrap;text-shadow:0 2px 7px rgba(0,0,0,.9)}
#lyrics{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 5.1%;overflow:hidden}#lyrics:before{content:"";position:absolute;left:3.3%;right:3.3%;top:2.5%;bottom:2.5%;border-radius:30px;background:linear-gradient(135deg,rgba(15,20,34,.34),rgba(6,9,17,.24));border:1px solid rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 14px 38px rgba(0,0,0,.12);pointer-events:none}#lyricsGroup{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;justify-content:center;gap:19px;transform:translate3d(0,0,0)}#lyricsGroup.stepA{animation:lyricsStepA .26s cubic-bezier(.20,.74,.26,1)}#lyricsGroup.stepB{animation:lyricsStepB .26s cubic-bezier(.20,.74,.26,1)}@keyframes lyricsStepA{0%{transform:translate3d(0,10px,0);opacity:.73}100%{transform:translate3d(0,0,0);opacity:1}}@keyframes lyricsStepB{0%{transform:translate3d(0,10px,0);opacity:.73}100%{transform:translate3d(0,0,0);opacity:1}}
.line{height:42px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 14px;line-height:1.17;font-weight:520;text-shadow:0 2px 7px rgba(0,0,0,.96);contain:layout style}.line .txt{max-width:96%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow-wrap:anywhere}.line.long{height:68px}.line.m2{font-size:22px;opacity:.38;color:rgba(255,255,255,.58);transform:scale(.965)}.line.m1{font-size:29px;opacity:.70;color:rgba(255,255,255,.82);transform:scale(.985)}.line.active{height:108px;font-size:58px;font-weight:790;opacity:1;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,1),0 0 17px rgba(140,175,255,.12)}.line.active.long{height:126px;font-size:46px}.line.active.popA{animation:activePopA .26s cubic-bezier(.20,.74,.26,1)}.line.active.popB{animation:activePopB .26s cubic-bezier(.20,.74,.26,1)}@keyframes activePopA{0%{transform:scale(.984);opacity:.70}55%{transform:scale(1.007);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes activePopB{0%{transform:scale(.984);opacity:.70}55%{transform:scale(1.007);opacity:1}100%{transform:scale(1);opacity:1}}.line.p1{font-size:31px;opacity:.74;color:rgba(255,255,255,.84);transform:scale(.99)}.line.p2{font-size:26px;opacity:.48;color:rgba(255,255,255,.66);transform:scale(.975)}.line.p3{font-size:22px;opacity:.30;color:rgba(255,255,255,.52);transform:scale(.96)}.line.m1.long,.line.p1.long{font-size:26px}.line.m2.long,.line.p2.long,.line.p3.long{font-size:21px}.empty{font-size:38px!important;opacity:.94!important;color:#fff!important}.hint{font-size:20px!important;opacity:.56!important}
#progressWrap{position:absolute;left:40px;right:40px;bottom:42px;height:18px;display:flex;align-items:center;z-index:8;cursor:pointer;touch-action:none}.bar{position:relative;width:100%;height:4px;background:rgba(255,255,255,.17);border-radius:5px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,hsla(var(--h1),90%,67%,.90),hsla(var(--h2),88%,70%,.94),#fff);border-radius:5px;transform:scaleX(0);transform-origin:left center}footer{height:9%;min-height:58px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;color:rgba(255,255,255,.50);font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.9)}
#controlDock{position:absolute;left:40px;bottom:67px;z-index:10;width:390px;padding:13px 12px 10px;border-radius:17px;background:linear-gradient(135deg,rgba(13,18,31,.84),rgba(6,9,17,.74));border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 28px rgba(0,0,0,.22)}.dockClose{position:absolute;right:7px;top:6px;width:27px;height:27px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:rgba(255,255,255,.72);font-size:19px;line-height:27px;padding:0}.controls{display:flex;gap:8px;padding-right:30px}.ctrl{flex:1;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.105);color:#fff;font-size:13px;font-weight:680}.ctrl:active{background:rgba(255,255,255,.22)}.delayRow{display:flex;align-items:center;gap:8px;margin-top:9px}.delayBtn{width:92px;flex:none}.delayValue{flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.065);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.88);font-size:13px;font-weight:650;white-space:nowrap}.dockBottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}.delayHint{font-size:10px;color:rgba(255,255,255,.42)}.reconnect{border:0;background:transparent;color:rgba(255,255,255,.44);font-size:10px;padding:3px 2px}#dockOpen{position:absolute;left:18px;bottom:66px;z-index:11;width:46px;height:46px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:linear-gradient(135deg,rgba(13,18,31,.84),rgba(6,9,17,.76));box-shadow:0 8px 22px rgba(0,0,0,.20);color:#fff;font-size:23px;display:none;align-items:center;justify-content:center}body.dockHidden #controlDock{display:none}body.dockHidden #dockOpen{display:flex}
@media(max-height:650px){header{min-height:82px;padding-top:14px}.title{font-size:30px}#lyricsGroup{gap:13px}.line{height:35px}.line.long{height:56px}.line.active{height:86px;font-size:49px}.line.active.long{height:104px;font-size:40px}#progressWrap{bottom:34px}footer{min-height:48px}#controlDock{bottom:57px;width:365px;padding:10px}.ctrl,.delayValue{height:31px}.delayBtn{width:86px}.delayRow{margin-top:7px}#dockOpen{bottom:56px;width:42px;height:42px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.1/dist/umd/t2cn.js"></script>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
</head>
<body>
<div id="coverBg"></div><div id="aurora"></div><div id="shade"></div>
<div id="app">
<header><div class="track"><div id="title" class="title">等待手机播放器</div><div id="artist" class="artist">Tesla Lyrics</div></div><div id="status" class="status">正在连接…</div></header>
<div id="lyrics"><div id="lyricsGroup"><div class="line m2"><span class="txt">&nbsp;</span></div><div class="line m1"><span class="txt">&nbsp;</span></div><div class="line active"><span class="txt">等待播放</span></div><div class="line p1"><span class="txt">&nbsp;</span></div><div class="line p2"><span class="txt">&nbsp;</span></div><div class="line p3"><span class="txt">&nbsp;</span></div></div></div>
<div id="controlDock"><button id="dockClose" class="dockClose">×</button><div class="controls"><button id="prevBtn" class="ctrl">上一首</button><button id="toggleBtn" class="ctrl">播放</button><button id="nextBtn" class="ctrl">下一首</button></div><div class="delayRow"><button id="delayEarlier" class="ctrl delayBtn">−0.5s</button><div id="delayValue" class="delayValue">延迟 1.0s</div><button id="delayLater" class="ctrl delayBtn">+0.5s</button></div><div class="dockBottom"><span class="delayHint">− = 歌词提前　+ = 歌词延后</span><button id="reconnect" class="reconnect">重新连接</button></div></div>
<button id="dockOpen">⚙</button><div id="progressWrap"><div class="bar"><div id="fill" class="fill"></div></div></div><footer><span id="time">0:00 / 0:00</span><span id="footerSync">TESLA LYRICS · 延迟 1.0s</span></footer>
</div>
<script>
(function(){'use strict';
var BROKER='wss://broker.emqx.io:8084/mqtt',BASE='teslalyrics/hanz316/9f2c7e6a3b8d4f10a15c',STATE_TOPIC=BASE+'/state',LYR_TOPIC=BASE+'/lyrics',CMD_TOPIC=BASE+'/cmd';
var DELAY_KEY='teslalyrics_delay_ms_v1',DOCK_KEY='teslalyrics_dock_hidden_v1';
var client=null,connected=false,state=null,pendingLyrics=null,lines=[],lyricsSource='',lastTrackKey='',lastRendered=-999,lastToken='',stateAnchor=0,lastStateAt=0,dragMs=null,lyricTimer=null,lyricsWaitTimer=null,coverTimer=null,lastCoverKey='',flip=false,LYRIC_DELAY_MS=1000;
try{var d=parseInt(localStorage.getItem(DELAY_KEY),10);if(isFinite(d))LYRIC_DELAY_MS=Math.max(-5000,Math.min(5000,d));if(localStorage.getItem(DOCK_KEY)==='1')document.body.classList.add('dockHidden')}catch(e){}
var titleEl=document.getElementById('title'),artistEl=document.getElementById('artist'),statusEl=document.getElementById('status'),groupEl=document.getElementById('lyricsGroup'),lineEls=groupEl.querySelectorAll('.line'),textEls=groupEl.querySelectorAll('.txt'),activeEl=lineEls[2],fillEl=document.getElementById('fill'),timeEl=document.getElementById('time'),coverEl=document.getElementById('coverBg'),progressEl=document.getElementById('progressWrap'),toggleBtn=document.getElementById('toggleBtn'),delayValueEl=document.getElementById('delayValue'),footerSyncEl=document.getElementById('footerSync');
var toSimple=function(s){return String(s||'')};try{if(window.OpenCC&&OpenCC.Converter)toSimple=OpenCC.Converter({from:'t',to:'cn'})}catch(e){}function simp(s){try{return toSimple(String(s||''))}catch(e){return String(s||'')}}
function fmt(ms){ms=Math.max(0,Math.floor((Number(ms)||0)/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')}function trackKey(s){return [s&&s.title||'',s&&s.artist||'',s&&s.album||'',Number(s&&s.duration)||0].join('|')}function mediaPosition(){if(dragMs!==null)return dragMs;if(!state)return 0;var p=Number(state.elapsed)||0;if(state.playing&&stateAnchor)p+=Math.max(0,Date.now()-stateAnchor);var d=Number(state.duration)||0;if(d>0)p=Math.min(p,d);return Math.max(0,p)}function lyricPosition(){return Math.max(0,mediaPosition()-LYRIC_DELAY_MS)}
function delayLabel(){if(LYRIC_DELAY_MS>0)return '延迟 '+(LYRIC_DELAY_MS/1000).toFixed(1)+'s';if(LYRIC_DELAY_MS<0)return '提前 '+(Math.abs(LYRIC_DELAY_MS)/1000).toFixed(1)+'s';return '同步 0.0s'}function refreshDelay(){var x=delayLabel();delayValueEl.textContent=x;footerSyncEl.textContent='TESLA LYRICS · '+x}function adjustDelay(n){LYRIC_DELAY_MS=Math.max(-5000,Math.min(5000,LYRIC_DELAY_MS+n));try{localStorage.setItem(DELAY_KEY,String(LYRIC_DELAY_MS))}catch(e){}refreshDelay();scheduleLyrics(true)}
function statusText(){if(!connected)return '正在连接…';if(!state)return '已连接 · 等待播放器';if(Date.now()-lastStateAt>40000)return '手机状态超时 · 正在恢复';return (state.playing?'播放中':'已暂停')+(lyricsSource?' · '+lyricsSource:'')+' · WSS'}
function isLong(t){return String(t||'').replace(/\s+/g,'').length>23}function setSlot(i,text,extra){var t=String(text||' ');if(textEls[i].textContent!==t)textEls[i].textContent=t;lineEls[i].classList.toggle('long',isLong(t));lineEls[i].classList.toggle('empty',extra==='empty');lineEls[i].classList.toggle('hint',extra==='hint')}function animateLyrics(){flip=!flip;groupEl.className=flip?'stepA':'stepB';activeEl.classList.remove('popA','popB');activeEl.classList.add(flip?'popA':'popB')}function setMessage(a,b){clearTimeout(lyricTimer);lastRendered=-999;lastToken=a+'|'+b;setSlot(0,' ');setSlot(1,' ');setSlot(2,a,'empty');setSlot(3,b||'','hint');setSlot(4,' ');setSlot(5,' ');animateLyrics()}
function parseLrc(raw){var out=[];String(raw||'').split(/\r?\n/).forEach(function(row){var m=row.match(/^\[(\d{1,3}):(\d{1,2}(?:\.\d{1,3})?)\]\s?(.*)$/);if(!m)return;var text=(m[3]||' ').replace(/<\d+:\d+(?:\.\d+)?>/g,'').trim();out.push({t:(parseInt(m[1],10)*60+parseFloat(m[2]))*1000,text:simp(text||' ')})});out.sort(function(a,b){return a.t-b.t});return out}function lyricIndex(p){if(!lines.length||p<lines[0].t)return -1;var lo=0,hi=lines.length-1;while(lo<=hi){var mid=(lo+hi)>>1;if(lines[mid].t<=p)lo=mid+1;else hi=mid-1}return hi}function updateLyrics(idx,force){var token=lastTrackKey+'|'+lyricsSource+'|'+lines.length+'|'+LYRIC_DELAY_MS;if(!force&&idx===lastRendered&&token===lastToken)return;lastRendered=idx;lastToken=token;var rel=[-2,-1,0,1,2,3];for(var k=0;k<6;k++){var j=idx+rel[k];setSlot(k,j>=0&&j<lines.length?lines[j].text:' ')}animateLyrics()}function scheduleLyrics(force){clearTimeout(lyricTimer);if(!lines.length)return;var p=lyricPosition(),idx=lyricIndex(p);updateLyrics(idx,!!force);if(state&&state.playing){var next=idx+1;if(next<lines.length){var wait=lines[next].t-p;lyricTimer=setTimeout(function(){scheduleLyrics(false)},Math.max(18,Math.min(10000,wait+5)))}}}
function renderClock(){var mp=mediaPosition(),dur=state?Number(state.duration)||0:0;timeEl.textContent=fmt(mp)+' / '+fmt(dur);fillEl.style.transform='scaleX('+(dur>0?Math.max(0,Math.min(1,mp/dur)):0).toFixed(4)+')';statusEl.textContent=statusText();toggleBtn.textContent=state&&state.playing?'暂停':'播放'}setInterval(renderClock,500);
function applyPendingLyrics(){if(!state||!pendingLyrics)return;var x=pendingLyrics;if(x.key&&x.key!==lastTrackKey)return;var parsed=parseLrc(x.lrc||'');if(parsed.length<4)return;clearTimeout(lyricsWaitTimer);lines=parsed;lyricsSource=x.provider||'多源匹配';scheduleLyrics(true);renderClock()}
function acceptState(s){if(!s||s.kind!=='state')return;state=s;stateAnchor=Date.now();lastStateAt=Date.now();titleEl.textContent=simp(s.title||'未知歌曲');artistEl.textContent=simp((s.artist||'')+(s.source?' · '+s.source:''));var key=trackKey(s);if(key!==lastTrackKey){lastTrackKey=key;lines=[];lyricsSource='';lastRendered=-999;setMessage('正在等待歌词…','手机多源匹配中');scheduleCover(s);clearTimeout(lyricsWaitTimer);lyricsWaitTimer=setTimeout(function(){if(!lines.length&&lastTrackKey===key)setMessage('暂未匹配到歌词','切歌后会自动重新匹配')},12500)}applyPendingLyrics();renderClock();scheduleLyrics(true)}
function acceptLyrics(x){if(!x||x.kind!=='lyrics')return;pendingLyrics=x;applyPendingLyrics()}
function compact(s){return String(s||'').toLowerCase().replace(/[\s\-—_·•.,，。!！?？:：'"“”‘’/\\]/g,'')}function cleanTitle(s){var x=String(s||'').trim();x=x.replace(/\s*[（(【\[][^）)】\]]*[）)】\]]\s*$/g,'').trim();return x||String(s||'').trim()}function firstArtist(s){return String(s||'').split(/\s*(?:\/|、|,|，|×|;|；| feat\.? | ft\.? )\s*/i)[0]||''}function hashTheme(key){var h=0;for(var i=0;i<key.length;i++)h=((h<<5)-h+key.charCodeAt(i))|0;h=Math.abs(h);document.documentElement.style.setProperty('--h1',String(h%360));document.documentElement.style.setProperty('--h2',String((h+64)%360));document.documentElement.style.setProperty('--h3',String((h+142)%360))}function scheduleCover(s){clearTimeout(coverTimer);var copy={title:s.title||'',artist:s.artist||''};coverTimer=setTimeout(function(){setCover(copy)},500)}async function setCover(s){var key=(s.title||'')+'|'+(s.artist||'');if(key===lastCoverKey)return;lastCoverKey=key;hashTheme(key);coverEl.style.opacity='0';var term=(cleanTitle(s.title)+' '+firstArtist(s.artist)).trim();if(!term)return;for(var c=0;c<2;c++){try{var country=c?'CA':'CN',r=await fetch('https://itunes.apple.com/search?entity=song&limit=4&country='+country+'&term='+encodeURIComponent(term));if(!r.ok)continue;var j=await r.json();if(key!==lastCoverKey)return;if(!j.results||!j.results.length)continue;var pick=j.results[0];for(var i=0;i<j.results.length;i++)if(compact(j.results[i].trackName)===compact(cleanTitle(s.title))){pick=j.results[i];break}var art=String(pick.artworkUrl100||'').replace('100x100bb','180x180bb');if(art){coverEl.style.backgroundImage='url("'+art.replace(/"/g,'')+'")';coverEl.style.opacity='.68';return}}catch(e){}}}
function sendCommand(action,extra){if(!client||!client.connected)return;var x={kind:'control',action:action,ts:Date.now()};if(extra)for(var k in extra)x[k]=extra[k];client.publish(CMD_TOPIC,JSON.stringify(x),{qos:0,retain:false})}
document.getElementById('prevBtn').onclick=function(){sendCommand('previous')};document.getElementById('nextBtn').onclick=function(){sendCommand('next')};toggleBtn.onclick=function(){sendCommand('toggle')};document.getElementById('delayEarlier').onclick=function(){adjustDelay(-500)};document.getElementById('delayLater').onclick=function(){adjustDelay(500)};document.getElementById('dockClose').onclick=function(){document.body.classList.add('dockHidden');try{localStorage.setItem(DOCK_KEY,'1')}catch(e){}};document.getElementById('dockOpen').onclick=function(){document.body.classList.remove('dockHidden');try{localStorage.setItem(DOCK_KEY,'0')}catch(e){}};document.getElementById('reconnect').onclick=function(){try{if(client)client.end(true)}catch(e){}setTimeout(startMqtt,250)};
function seekFromX(x,commit){if(!state||!Number(state.duration))return;var r=progressEl.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(x-r.left)/r.width));dragMs=Math.round(Number(state.duration)*ratio);renderClock();if(commit){var target=dragMs;dragMs=null;state.elapsed=target;stateAnchor=Date.now();sendCommand('seek',{position:target});renderClock();scheduleLyrics(true)}}var dragging=false;progressEl.addEventListener('mousedown',function(e){dragging=true;seekFromX(e.clientX,false)});window.addEventListener('mousemove',function(e){if(dragging)seekFromX(e.clientX,false)});window.addEventListener('mouseup',function(e){if(dragging){dragging=false;seekFromX(e.clientX,true)}});progressEl.addEventListener('touchstart',function(e){dragging=true;seekFromX(e.touches[0].clientX,false);e.preventDefault()},{passive:false});progressEl.addEventListener('touchmove',function(e){if(dragging)seekFromX(e.touches[0].clientX,false);e.preventDefault()},{passive:false});progressEl.addEventListener('touchend',function(e){if(dragging){dragging=false;var x=e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientX:progressEl.getBoundingClientRect().left;seekFromX(x,true)}e.preventDefault()},{passive:false});
function startMqtt(){connected=false;statusEl.textContent='正在连接…';if(!window.mqtt){statusEl.textContent='通信组件加载失败';return}client=mqtt.connect(BROKER,{clientId:'tlx-car-'+Math.random().toString(16).slice(2),clean:true,keepalive:30,reconnectPeriod:1500,connectTimeout:10000,protocolVersion:4});client.on('connect',function(){connected=true;client.subscribe([STATE_TOPIC,LYR_TOPIC],{qos:0});setTimeout(function(){sendCommand('resync')},500);renderClock()});client.on('message',function(topic,payload){try{var x=JSON.parse(String(payload||''));if(topic===STATE_TOPIC)acceptState(x);else if(topic===LYR_TOPIC)acceptLyrics(x)}catch(e){}});client.on('offline',function(){connected=false;renderClock()});client.on('close',function(){connected=false;renderClock()});client.on('error',function(){connected=false;renderClock()})}
refreshDelay();renderClock();startMqtt();document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(lyricTimer);clearTimeout(coverTimer)}else{renderClock();scheduleLyrics(true);if(client&&client.connected)sendCommand('resync')}});
})();
</script>
</body>
