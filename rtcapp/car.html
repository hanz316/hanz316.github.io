<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tesla Lyrics WebRTC App Probe</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif;padding:28px}h1{font-size:32px}.card{background:#171a21;border-radius:16px;padding:20px;margin:16px 0}.ok{color:#56f59a}.bad{color:#ff7d7d}.muted{color:#9fa8b8}.track{font-size:30px;font-weight:700}.artist{font-size:19px;color:#bac2cf;margin-top:7px}.lyrics{font-size:25px;line-height:1.5;white-space:pre-wrap;max-height:330px;overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}button{font-size:18px;padding:12px 18px;border:0;border-radius:10px}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.45;max-height:220px;overflow:hidden}</style><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script></head><body><h1>TESLA LYRICS · WEBRTC APP</h1><div class="card"><div id="sig">PeerJS：连接中</div><div id="phone">Android APK：等待</div><div id="route">链路：等待</div><div id="rtt">RTT：等待</div></div><div class="card"><div id="title" class="track">等待手机播放器</div><div id="artist" class="artist">Tesla Lyrics</div><div id="pos" class="muted" style="margin-top:10px">0:00 / 0:00</div></div><div class="card"><div id="lyrics" class="lyrics">等待 APK 发送歌词…</div></div><div class="card row"><button onclick="cmd('previous')">上一首</button><button onclick="cmd('toggle')">播放/暂停</button><button onclick="cmd('next')">下一首</button><button onclick="cmd('seek',Math.max(0,lastElapsed+10000))">+10s</button><button onclick="connectNow()">重新连接</button></div><div class="card"><pre id="log"></pre></div><script>var PHONE='hanz-tesla-lyrics-android-20260828',peer=null,conn=null,lastElapsed=0,lastDuration=0,lastBase=0,lastPlaying=false,lastLyrics='';function e(id){return document.getElementById(id)}function log(s){e('log').textContent=(s+'\n'+e('log').textContent).slice(0,7000)}function fmt(ms){ms=Math.max(0,ms||0);var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function nowPos(){return Math.min(lastDuration||1,lastElapsed+(lastPlaying?Date.now()-lastBase:0))}function renderClock(){e('pos').textContent=fmt(nowPos())+' / '+fmt(lastDuration)}setInterval(renderClock,250);function cmd(a,p){if(conn&&conn.open){var x={kind:'control',action:a};if(a==='seek')x.position=p;conn.send(x)}}function bind(c){c.on('open',function(){e('phone').innerHTML='Android APK：<span class=ok>已连接</span>';ping();setInterval(ping,1500);stats(c)});c.on('data',function(d){try{if(d.kind==='pong'){e('rtt').innerHTML='RTT：<span class=ok>'+(Date.now()-d.t)+' ms</span>';return}if(d.kind==='state'){e('title').textContent=d.title||'等待手机播放器';e('artist').textContent=d.artist||'';lastElapsed=Number(d.elapsed||0);lastDuration=Number(d.duration||0);lastPlaying=!!d.playing;lastBase=Date.now();log('STATE '+(d.title||''));return}if(d.kind==='lyrics'){lastLyrics=d.lrc||'';var lines=lastLyrics.split(/\r?\n/).filter(function(x){return /\[\d{1,3}:\d/.test(x)}).slice(0,18).map(function(x){return x.replace(/^\[[^\]]+\]\s*/,'')});e('lyrics').textContent=(d.provider?'['+d.provider+']\n':'')+(lines.join('\n')||'收到歌词但无法解析');log('LYRICS '+(d.provider||''));return}log('RX '+JSON.stringify(d))}catch(x){log('RXERR '+x)}});c.on('close',function(){e('phone').innerHTML='Android APK：<span class=bad>已断开</span>'});c.on('error',function(x){log('conn '+x)})}function connectNow(){if(!peer||peer.destroyed)return;if(conn&&conn.open)return;try{conn=peer.connect(PHONE,{serialization:'json',reliable:true});bind(conn)}catch(x){log(x)}}function ping(){if(conn&&conn.open)conn.send({kind:'ping',t:Date.now()})}function stats(c){var pc=c.peerConnection||c._pc||c.pc;if(!pc||!pc.getStats)return;setTimeout(function(){pc.getStats().then(function(r){var all={},pair=null;r.forEach(function(x){all[x.id]=x});r.forEach(function(x){if(x.type==='candidate-pair'&&x.state==='succeeded'&&(x.nominated||x.selected))pair=x});if(!pair)return;var l=all[pair.localCandidateId]||{},rr=all[pair.remoteCandidateId]||{},lt=l.candidateType||'?',rt=rr.candidateType||'?';e('route').innerHTML='链路：<span class=ok>无 TURN</span> · '+lt+' ↔ '+rt})},1800)}if(typeof Peer==='undefined'){e('sig').innerHTML='PeerJS：<span class=bad>加载失败</span>'}else{peer=new Peer({config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}],iceTransportPolicy:'all'}});peer.on('open',function(id){e('sig').innerHTML='PeerJS：<span class=ok>在线</span>';setTimeout(connectNow,500)});peer.on('error',function(x){e('sig').textContent='PeerJS：'+String(x.type||x);log('peer '+x)})}</script></body></html>
