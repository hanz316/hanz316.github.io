<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tesla Login</title>
  <style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b0d;color:#f5f5f7;margin:0;padding:40px 20px}main{max-width:720px;margin:auto}h1{font-size:28px}p{line-height:1.6;color:#c9c9ce}a{color:#8ab4ff;word-break:break-all}</style>
</head>
<body><main><h1>Returning to Tesla Lyrics…</h1><p id="msg">Processing authorization response.</p><p id="fallback"></p></main>
<script>
(function(){
  var q=window.location.search||'';
  var deep='teslalyrics://oauth/callback'+q;
  document.getElementById('fallback').innerHTML='If the app does not open automatically, <a href="'+deep.replace(/&/g,'&amp;')+'">tap here to return to Tesla Lyrics</a>.';
  setTimeout(function(){window.location.href=deep;},150);
})();
</script>
</body>
</html>
